services:
  music_bot:
    build: .
    container_name: instagram_music_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./downloads:/app/downloads
      - ./temp:/app/temp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
